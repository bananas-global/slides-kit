{{head}}
        <div class="spacer"></div>
        <ul class="cards cards--n{{count}}">
<!-- item:start -->
          <li class="card card--image">
            <div class="card-text">
              <p class="card-e">{{item.eyebrow}}</p>
              <h3 class="card-t">{{item.title}}</h3>
              <p class="card-b">{{item.body}}</p>
            </div>
            <span class="ph card-photo"><img src="{{item.image}}" alt="{{item.alt}}"></span>
          </li>
<!-- item:end -->
        </ul>
        <div class="spacer"></div>
