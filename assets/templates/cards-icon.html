{{head}}
        <div class="spacer"></div>
        <ul class="cards cards--n{{count}}">
<!-- item:start -->
          <li class="card">
            <span class="card-icon"><svg class="ico" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">{{item.icon}}</svg></span>
            <h3 class="card-t">{{item.title}}</h3>
            <p class="card-b">{{item.body}}</p>
          </li>
<!-- item:end -->
        </ul>
        <div class="spacer"></div>
